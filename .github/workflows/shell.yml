name: Shell
on:
  # bench-only: run on each PR into starsling/develop; no push trigger.
  pull_request:
    branches: [ starsling/develop ]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: starsling-ubuntu-26.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
